[base]
package = ocean
env_name = puffer_royale
policy_name = Policy
rnn_name = Recurrent

[env]
num_envs = 512
size = 11

[train]
total_timesteps = 20_000_000    # 5× more training
gamma = 0.999
learning_rate = 0.0003           # safer LR for long runs
minibatch_size = 2048         # smoother updates (optional)
ent_coef = 0.03

update_epochs = 4
clip_range = 0.2
gae_lambda = 0.95
vf_coef = 0.5
max_grad_norm = 0.5
target_kl = 0.015         # stop/early reduce lr if KL exceeds this
normalize_observation = true
normalize_reward = true


