[base]
package = ocean
env_name = puffer_royale
policy_name = Policy
rnn_name = Recurrent

[env]
num_envs = 512
size = 11

[train]
total_timesteps = 20_000_000    # 5× more training
gamma = 0.995
learning_rate = 0.0003           # safer LR for long runs
minibatch_size = 16384           # smoother updates (optional)
ent_coef = 0.01
